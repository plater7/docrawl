name: Fuzzing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"  # Weekly Sunday at 03:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install atheris
          pip install -r requirements.txt

      - name: Fuzz url validator
        run: python fuzz/fuzz_url_validator.py -atheris_runs=5000
        env:
          PYTHONPATH: .

      - name: Fuzz url filter
        run: python fuzz/fuzz_url_filter.py -atheris_runs=5000
        env:
          PYTHONPATH: .

      - name: Fuzz css selectors
        run: python fuzz/fuzz_css_selectors.py -atheris_runs=5000
        env:
          PYTHONPATH: .
