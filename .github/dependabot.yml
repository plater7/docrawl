version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "devops"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "devops"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # v2.6.0 shipped a broken GHCR image (index children 404), so the
      # action cannot be pulled; unblock once a pullable 2.6.x exists.
      - dependency-name: "ossf/scorecard-action"
        versions: ["2.6.0"]
    labels:
      - "devops"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "ci"
